[package]
name = "claude-runtime-protocol"
version = "0.1.0"
edition = "2021"

[dependencies]
tonic = "0.14"
prost = "0.14"
# tonic 0.14 split the prost codec out of `tonic` proper into this crate (see build.rs comment).
tonic-prost = "0.14"

[build-dependencies]
# tonic-build's prost codegen (configure()/compile()) moved to this crate as of tonic 0.13/0.14.
tonic-prost-build = "0.14"
