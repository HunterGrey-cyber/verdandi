[package]
name = "claude-runtime-protocol"
version = "0.1.0"
edition = "2021"

[dependencies]
tonic = "0.14"
prost = "0.14"
# tonic 0.14 split the prost codec out of `tonic` proper into this crate (see build.rs comment).
tonic-prost = "0.14"

[build-dependencies]
# tonic-build's prost codegen (configure()/compile()) moved to this crate as of tonic 0.13/0.14.
tonic-prost-build = "0.14"
# build.rs reads capabilities.json, the one source for the protocol numbers and capability strings.
serde_json = "1"

[dev-dependencies]
# tests/protocol_constants.rs reads the same file and compares it with the generated constants.
serde_json = "1"
