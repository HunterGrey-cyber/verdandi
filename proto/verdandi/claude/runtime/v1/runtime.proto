syntax = "proto3";

package verdandi.claude.runtime.v1;

// ---- Handshake ----

message HandshakeRequest {
  uint32 client_protocol_major = 1;
}

message HandshakeResponse {
  uint32 protocol_major = 1;
  uint32 protocol_minor = 2;
  string sidecar_version = 3;
  string claude_agent_sdk_version = 4;
  string sdk_declared_claude_code_version = 5;
  string actual_claude_code_version = 6;
  repeated string capabilities = 7;
  // The PRESET names this sidecar understands for ClaudeHostPolicy.configuration -- NOT the space of
  // configurations a client can express. Since setting_sources (ClaudeHostPolicy tag 7) exists, the
  // settings-tier half of each preset can be overridden independently, so a client that reads this
  // list as "the two available configurations" is reading it wrong. Check `capabilities` for
  // 'setting_sources' / 'tool_policy' to learn what else is expressible.
  repeated string configuration_profiles = 8;
  repeated string permission_modes = 9;
  uint64 max_message_bytes = 10;
  string event_buffer_policy = 11;

  // Which local Claude account every session this sidecar process creates authenticates as. The
  // binding is per PROCESS (VERDANDI_CLAUDE_ACCOUNT, resolved once at startup), never per request, so
  // a client that needs one particular account picks a sidecar -- and this is how it checks, before
  // creating any session, that it picked the right one.
  //
  // UNSPECIFIED means a sidecar older than these fields: neither "unpinned" nor an all-clear. A
  // client that requires a pinned account must refuse it.
  AccountBinding account_binding = 12;
  // The pinned account's name (VERDANDI_CLAUDE_ACCOUNT, e.g. "work"). Empty unless PINNED.
  string account_name = 13;
  // The pinned account's config directory, absolute. Empty unless PINNED. For an account at the CLI's
  // default location this is $HOME/.claude and no CLAUDE_CONFIG_DIR is set on its sessions (see
  // ACCOUNT_BINDING_PINNED). This is what the operator configured, not proof of whose login is stored
  // there; SessionReady.account_identity is that proof.
  string account_config_dir = 14;

  // Whether this process ran the startup egress probe, and what it found. Reported, never configured
  // by the client: the operator asks for the probe (VERDANDI_CLAUDE_SIDECAR_EGRESS=restricted) and the
  // sidecar reports the result. The probe connects to a listener this process opens on 127.0.0.1; it
  // tests loopback only, not private address ranges in general. A sidecar whose probe reached loopback
  // refuses to start, so a running sidecar never reports LOOPBACK_REACHABLE today.
  //
  // UNSPECIFIED means a sidecar older than this field. Capability 'egress_probe'.
  EgressProbe egress_probe = 15;

  // The tool names the CLI adds by itself to a session that has CreateSessionRequest.output_format: it
  // delivers structured output through a synthetic tool call, so such a session's
  // SessionReady.init_fingerprint.tools lists these beside the allow list even though nobody asked for
  // them. A client that compares the fingerprint with what it requested reads the names from here
  // rather than writing them into its own code. Measured, not assumed: a CLI release that renames the
  // carrier changes this list together with a new recording. Capability 'structured_output_tools'.
  repeated string structured_output_tools = 16;

  // What this sidecar makes of the `claude` CLI a HOST_CLI session runs (the installed one), as a
  // verdict plus the facts behind it. Always filled by a sidecar that has the capability
  // 'cli_compatibility_report'; absent from an older one, which says nothing about its CLI beyond
  // actual_claude_code_version. By default (VERDANDI_CLAUDE_SIDECAR_CLI_GATE unset or `refuse`) a
  // sidecar whose CLI is REFUSED or UNKNOWN never starts, so a handshake that arrives reports
  // SUPPORTED or UNTESTED only; REFUSED and UNKNOWN can be seen only from a sidecar the operator
  // started with CLI_GATE=report, which binds anyway, reports the verdict here and refuses
  // CreateSession (UNSUPPORTED_CLI_VERSION) unless the request sets
  // ClaudeHostPolicy.accept_unsupported_cli. Capability 'cli_compatibility_report'.
  CliCompatibility cli_compatibility = 17;

  // The same for the CLI inside the agent SDK's npm package (what SDK_BUNDLED runs). Present only
  // when this build can serve that executable (the capability 'executable_sdk_bundled'): a packaged
  // single-file build cannot spawn it, so it has no verdict to give, and absence here means that,
  // not "fine".
  CliCompatibility bundled_cli_compatibility = 18;

  // The configuration directory the `claude` CLI really reads for the sessions this process creates:
  // where its settings, credentials, projects and transcripts are, so a host that has to find a
  // session's transcript on disk does not have to guess. Absolute, or empty when it cannot be known.
  //
  // - A pinned account (account_binding PINNED): that account's directory, the same string as
  //   account_config_dir. For an account at the CLI's default location it is $HOME/.claude, and no
  //   CLAUDE_CONFIG_DIR is set on its sessions.
  // - Unpinned: what the sessions inherit. The sidecar's own CLAUDE_CONFIG_DIR when it is set: that
  //   path if absolute, empty if relative (the CLI resolves it against a directory the sidecar does not
  //   know). Unset: $HOME/.claude, or empty with no usable HOME. Empty means "not known", not "there
  //   is none".
  //
  // Only a path, computed from the process's environment: nothing under it is read, and this says
  // nothing about whose login is stored there (SessionReady.account_identity is that proof).
  // account_config_dir keeps its meaning (empty unless PINNED). Absent from a sidecar older than the
  // capability 'effective_claude_config_dir'.
  string effective_claude_config_dir = 19;

  // Held for a later minor's attachment limits, so that no other field can take the number first.
  reserved 20;
}

// One CLI binary's compatibility with this sidecar. The version and range are the facts; the verdict
// is the sidecar's reading of them: a version a real-CLI test run has exercised, inside the range, is
// SUPPORTED; one inside the range but never tested is UNTESTED; anything else is REFUSED. UNKNOWN is
// a version that could not be read at all.
message CliCompatibility {
  CliVerdict verdict = 1;
  // The version the CLI printed (`claude --version`'s first word), or the SDK's declared one for the
  // bundled binary. Empty when UNKNOWN: the sidecar never saw a version, and `diagnostic` says why.
  string version = 2;
  // The range this sidecar supports, as ">=2.1.252 <3.0.0": the lower bound is inclusive and the
  // upper one exclusive.
  string supported_range = 3;
  // The versions a real-CLI test run has exercised, inside that range. Reported so a host can show
  // how far from tested a CLI is; a version outside this list but inside the range is UNTESTED, and
  // starts anyway.
  repeated string tested_versions = 4;
  // Human-readable, and never parsed: why the verdict is what it is. Empty when SUPPORTED.
  string diagnostic = 5;
}

enum CliVerdict {
  CLI_VERDICT_UNSPECIFIED = 0;
  // Exactly a tested version, inside the range.
  CLI_VERDICT_SUPPORTED = 1;
  // Inside the range, never tested against this sidecar. Usable; `diagnostic` says so.
  CLI_VERDICT_UNTESTED = 2;
  // Outside the range, on the known-incompatible list, unparseable, or untested under the strict
  // switch. A session on this CLI is refused unless the host accepts it per session.
  CLI_VERDICT_REFUSED = 3;
  // The version could not be determined (the CLI is missing or refused to answer `--version`). Treated
  // exactly as REFUSED: an unknown version is not a supported one.
  CLI_VERDICT_UNKNOWN = 4;
}

enum EgressProbe {
  EGRESS_PROBE_UNSPECIFIED = 0;
  // The operator did not ask for the probe; nothing is claimed about this process's egress.
  EGRESS_PROBE_NOT_RUN = 1;
  // The probe completed a connection to loopback. Reserved for completeness: such a sidecar refuses to
  // start instead of answering a handshake.
  EGRESS_PROBE_LOOPBACK_REACHABLE = 2;
  // The probe could not reach loopback within its deadline. Also advertised as the capability
  // 'egress_restricted'.
  EGRESS_PROBE_LOOPBACK_BLOCKED = 3;
}

enum AccountBinding {
  ACCOUNT_BINDING_UNSPECIFIED = 0;
  // VERDANDI_CLAUDE_ACCOUNT named an account, and every session is bound to it: the four-variable
  // tuple (CLAUDE_PROFILE, CLAUDE_CONFIG_DIR, CLAUDE_SECURESTORAGE_CONFIG_DIR, ANTHROPIC_CONFIG_DIR)
  // is set to the account's directories -- or, for an account at the CLI's default location
  // (VERDANDI_CLAUDE_CONFIG_DIR=default), removed, so the CLI reads $HOME/.claude and
  // $HOME/.claude.json exactly as a plain `claude` does.
  ACCOUNT_BINDING_PINNED = 1;
  // Nothing is pinned: sessions inherit this process's own environment, i.e. whichever account the
  // shell that started the sidecar happened to carry.
  ACCOUNT_BINDING_UNPINNED = 2;
}

// ---- Host policy ----
//
// Mirrors @verdandi/claude-runtime's ClaudeHostPolicy in MEANING, field for field. Two shapes differ
// deliberately, and the difference is the point in both cases:
//   - `setting_sources` is a wrapper message here and a plain optional array in the kernel, because
//     proto3 gives a bare `repeated` field no presence and this field's whole job is to distinguish
//     "absent" from "stated, and empty".
//   - `ToolPolicy.deny` is `repeated` here (never absent on the wire) and optional in the kernel.
// Field ADDITIONS are caught by apps/claude-sidecar/tests/policyTotality.test.ts; shape divergence
// is not, so it is named here instead.

// A PRESET over two independent axes, not a single switch:
//
//   Axis A -- which filesystem settings tiers load (Options.settingSources).
//   Axis B -- whether the non-settings ambient channels are closed: MCP discovery
//             (strictMcpConfig + mcpServers {}) and auto-memory (settings.autoMemoryEnabled false
//             plus CLAUDE_CODE_DISABLE_AUTO_MEMORY=1).
//
// NATIVE = all three tiers, both channels open. ISOLATED = no tiers, both channels closed.
//
// ClaudeHostPolicy.setting_sources overrides axis A ONLY. Axis B has no other expression in this
// protocol and comes from this field alone, which is why adding a source list did not replace this
// enum: doing so would have deleted the only encoding of axis B.
enum ConfigurationProfile {
  CONFIGURATION_PROFILE_UNSPECIFIED = 0;
  CONFIGURATION_PROFILE_NATIVE = 1;
  CONFIGURATION_PROFILE_ISOLATED = 2;
}

enum PermissionMode {
  PERMISSION_MODE_UNSPECIFIED = 0;
  PERMISSION_MODE_INTERACTIVE = 1;
  PERMISSION_MODE_VERDANDI_RULES = 2;
  PERMISSION_MODE_BYPASS = 3;
}

// Which permission mode the CLI itself runs in under a gated session (ClaudeHostPolicy
// .cli_permission_mode). Capability 'cli_auto_mode'. The sidecar's PreToolUse gate is installed either
// way and still asks the host about every call; this only decides what the CLI does with a call the
// host leaves to it (ResolvePermissionRequest.defer).
enum CliPermissionMode {
  // What every client that predates the field sends. Means DEFAULT, and nothing else changes: the
  // session behaves exactly as it did before the field existed, PermissionDenied events included
  // (it gets none; see that message).
  CLI_PERMISSION_MODE_UNSPECIFIED = 0;
  // The CLI runs in `default`, as an UNSPECIFIED session does. Stating it opts the session into
  // PermissionDenied events.
  CLI_PERMISSION_MODE_DEFAULT = 1;
  // The CLI runs in `auto`: a call the host defers is decided by the CLI's own auto-mode classifier
  // instead of being asked about. Only with PERMISSION_MODE_INTERACTIVE (or UNSPECIFIED, read as
  // INTERACTIVE); combined with VERDANDI_RULES or BYPASS, or with permission_mode_switchable, it is
  // refused with INVALID_CONFIGURATION. SessionReady.permission_mode then reports `auto`, the CLI's
  // own word for it. Opts the session into PermissionDenied events too.
  CLI_PERMISSION_MODE_AUTO = 2;
}

enum PersistenceMode {
  PERSISTENCE_MODE_UNSPECIFIED = 0;
  PERSISTENCE_MODE_HOST_CLI = 1;
  PERSISTENCE_MODE_EPHEMERAL = 2;
  PERSISTENCE_MODE_EXTERNAL_STORE = 3;
}

enum ExecutableSource {
  EXECUTABLE_SOURCE_UNSPECIFIED = 0;
  EXECUTABLE_SOURCE_HOST_CLI = 1;
  EXECUTABLE_SOURCE_SDK_BUNDLED = 2;
}

// How much of an assistant reply the host wants to see while it is still being produced.
//
// Opt-in rather than always-on, and defaulting to COMPLETE, because PARTIAL changes the event
// stream materially: one turn goes from a handful of text_delta events to hundreds, which fills the
// per-session replay ring buffer far faster and makes an EVENT_GAP more reachable for a slow
// watcher. A consumer that only reads TurnCompleted.result_text (the Go control plane does exactly
// this) is unaffected either way and should keep the default.
enum StreamingMode {
  STREAMING_MODE_UNSPECIFIED = 0;
  // Assistant text arrives when a message completes. One text_delta per content block.
  STREAMING_MODE_COMPLETE = 1;
  // Assistant text arrives as it is produced, as many small text_delta events. Maps to the Claude
  // Agent SDK's `includePartialMessages`, whose stream events are Anthropic Messages API streaming
  // events -- presentation deltas, NOT a documented token boundary.
  STREAMING_MODE_PARTIAL = 2;
}

// ---- Tool policy (ClaudeHostPolicy tag 6) ----

// The ONLY built-in tools a session may run. A message rather than a bare repeated field on
// ToolPolicy because `[]` is meaningful and must not collide with silence: the SDK's own
// `Options.tools` documents "`[]` (empty array) - Disable all built-in tools". Absent => do not
// touch the base tool set. Present+empty => no built-in tools at all, stated.
message ToolAllowList {
  repeated string tools = 1;

  // What the sidecar does with the session's tool list as the CLI reports it in system/init. It lives
  // here, on the allow list, because there is only something to check when the caller stated one.
  // Capability 'init_check'; an older sidecar ignores the field and verifies, which is what
  // UNSPECIFIED means. A value this sidecar does not know is refused as INVALID_CONFIGURATION.
  InitCheck init_check = 2;
}

// The tool-set check on an explicit allow list. The sidecar compares system/init's tool list with the
// allow list (plus HandshakeResponse.structured_output_tools when the session has an output format):
// every tool reported must be permitted, and every tool the list names must be reported.
//
// The check DETECTS and TERMINATES; it does not prevent. system/init only exists once the first
// turn's message has reached the CLI, so the first model call has already started when it runs. A
// mismatch closes the session with SESSION_CLOSE_REASON_TOOL_POLICY_VIOLATION right after the
// offending SessionReady, before anything else of the turn is read, but under PERMISSION_MODE_BYPASS
// (no PreToolUse gate) a tool call the model starts before the close lands runs ungated. A client that
// needs "no tool executes unless allowed" gates the session (PERMISSION_MODE_INTERACTIVE) and answers
// each PermissionRequested itself.
enum InitCheck {
  // Verify, exactly as a sidecar older than this field does.
  INIT_CHECK_UNSPECIFIED = 0;
  // Verify, said explicitly.
  INIT_CHECK_VERIFY = 1;
  // Report SessionReady.init_fingerprint and never close the session over a mismatch: the client owns
  // the check. The allow list itself is applied exactly as under VERIFY.
  INIT_CHECK_REPORT_ONLY = 2;
}

// A static, session-lifetime restriction on which tools the provider may run, applied at session
// construction. NOT a replacement for the per-call PreToolUse gate that `permissions` selects --
// this is a prefilter that narrows what the gate can ever be asked about.
//
// ### `deny` IS A CONFIGURATION BOUNDARY, NOT A CONTAINMENT BOUNDARY
//
// Read that sentence again before relying on this message. `deny` shrinks the default attack
// surface; it does not contain a model that wants out. It is the one lever here the model cannot
// widen -- the SDK says disallowed tools "will be removed from the model's context and cannot be
// used, even if they would otherwise be allowed" -- and that is still only a statement about which
// tool names exist, not about what the session can reach. A denied Bash alongside an allowed Write
// still reaches the filesystem; a denied Write alongside an allowed Bash reaches it twice over.
//
// The actual containment boundary in this system is elsewhere and is untouched by this message: the
// PreToolUse hook installed under PERMISSION_MODE_INTERACTIVE / PERMISSION_MODE_VERDANDI_RULES,
// which gates every call on an out-of-process ResolvePermission decision that fails closed. Under
// PERMISSION_MODE_BYPASS that hook is not installed at all, and no ToolPolicy makes it exist. (A
// session CREATED gated and later switched to BYPASS by SetPermissionMode keeps its hook, which then
// abstains; see SetPermissionModeRequest.)
//
// Do not read a deny list here as "the session cannot do X". Read it as "the session was not handed
// X by default."
message ToolPolicy {
  // Tools this session must never run. Maps to the Agent SDK's `Options.disallowedTools`: "List of
  // tool names that are disallowed. These tools will be removed from the model's context and cannot
  // be used, even if they would otherwise be allowed." That last clause is why `deny` is the only
  // field here the operator's own settings cannot widen -- see the containment note above for what
  // that does and does not buy.
  //
  // Empty (or the whole ToolPolicy absent) means no denials -- EXCEPT under
  // PERMISSION_MODE_BYPASS, where a policy that states no restriction at all gets a conservative
  // default plus a ProviderNotice; see ClaudeHostPolicy.tool_policy.
  repeated string deny = 1;

  // When present, the base set of built-in tools. Maps to `Options.tools` -- deliberately NOT
  // `Options.allowedTools`, which the SDK defines as a PRE-APPROVAL list: "List of tool names that
  // are auto-allowed without prompting for permission. These tools will execute automatically
  // without asking the user for approval. To restrict which tools are available, use the `tools`
  // option instead." Mapping `allow` there would WIDEN access -- it would silently disable the
  // permission prompt for every named tool -- under a field whose name promises the opposite.
  // Do not "simplify" this to allowedTools.
  ToolAllowList allow = 2;

  // The caller stating outright that this session carries NO tool restriction at all.
  //
  // Only meaningful under PERMISSION_MODE_BYPASS, and it exists because silence could not say it.
  // A bypass session with an absent-or-empty ToolPolicy is handed the conservative deny list
  // described on ClaudeHostPolicy.tool_policy, and the ONLY way to decline that floor was to state
  // some OTHER restriction instead -- including a fake one naming no real tool, which that field's
  // own comment calls out as a real hole. That made "I want everything, deliberately"
  // indistinguishable on the wire from "I typo'd a deny entry".
  //
  // Setting this makes usesDefaultBypassDeny return false: CONSERVATIVE_BYPASS_DENY is not
  // injected, and no ProviderNotice{subtype:"bypass_default_deny_applied"} is emitted, because
  // nothing was applied and saying otherwise would be a lie on the event stream. It widens nothing
  // by itself -- BYPASS already installs no PreToolUse hook, so this only decides whether four tool
  // names are removed from the model's context.
  //
  // Setting it together with a non-empty `deny` or a present `allow` is self-contradictory, and
  // validatePolicy refuses it rather than resolving it in either direction: honouring this field
  // would discard a restriction the caller wrote down, and honouring the restriction would
  // re-apply a floor the caller explicitly declined.
  bool unrestricted = 3;
}

// ---- Setting sources (ClaudeHostPolicy tag 7) ----

// One filesystem settings tier. Mirrors the SDK's own `SettingSource` value for value
// (`'user' | 'project' | 'local'`), so nothing is re-interpreted on the way to
// Options.settingSources.
enum SettingSource {
  // Never valid inside a `sources` list; rejected with INVALID_CONFIGURATION, never dropped.
  // Dropping it turns `[UNSPECIFIED]` into `[]` -- "the tiers I named" silently becoming "none" --
  // and turns `[UNSPECIFIED, PROJECT]` into something narrower than what was written. Same stance
  // ReplayStart already takes on its own zero value.
  SETTING_SOURCE_UNSPECIFIED = 0;

  // ~/.claude/settings.json: the OPERATOR'S OWN hooks, plugins and `permissions.allow`. Including
  // this puts the machine owner's personal configuration inside every spawned session. Excluding it
  // is what Neovibe's legacy CLI path does on purpose, after a real reproduction confirmed a spawned
  // session otherwise inherits the calling human's global ~/.claude hooks and plugins.
  SETTING_SOURCE_USER = 1;

  // .claude/settings.json AND CLAUDE.md -- the SDK's settingSources doc: "Must include 'project' to
  // load CLAUDE.md files."
  SETTING_SOURCE_PROJECT = 2;

  // .claude/settings.local.json.
  SETTING_SOURCE_LOCAL = 3;
}

// Presence wrapper. A bare `repeated SettingSource setting_sources = 7` on ClaudeHostPolicy would be
// WRONG, and that is the entire reason this message exists: proto3 gives a repeated field no
// presence, so an old client that has never heard of the field and a new client deliberately asking
// for "load nothing" arrive as the same empty list -- flipping every existing caller from
// user+project+local to full isolation with no way to tell the two apart. A singular message field
// DOES have presence in proto3 (the same presence CreateSessionRequest.policy already relies on).
message SettingSourceSelection {
  // THIS SIDECAR treats order as insignificant and duplicates as harmless: it canonicalises to the
  // SDK's declared spelling order (user, project, local) and de-duplicates, so there is exactly one
  // meaning per set rather than several spellings that might drift apart.
  //
  // Stated as this sidecar's behaviour rather than as a fact about the SDK on purpose. The SDK
  // documents only WHICH tiers load, not any precedence between them, so "order is not significant"
  // is an assumption here, not a quoted guarantee. If the SDK ever gives the array order a meaning,
  // this canonicalisation silently reinterprets a stated request -- so that is the thing to re-check
  // before relying on it, and the reason the claim is scoped rather than absolute.
  repeated SettingSource sources = 1;
}

message ClaudeHostPolicy {
  // A PRESET over two independent axes -- see ConfigurationProfile's own comment. `setting_sources`
  // below overrides axis A only; axis B (MCP discovery, auto-memory) has no other expression and
  // comes from this field alone.
  ConfigurationProfile configuration = 1;
  PermissionMode permissions = 2;
  PersistenceMode persistence = 3;
  ExecutableSource executable = 4;
  StreamingMode streaming = 5;

  // Absent => no tool restriction from the policy, EXCEPT that a BYPASS session stating no
  // restriction at all (this field absent, or present with an empty `deny` and no `allow`) has the
  // sidecar's conservative deny list applied and announces it with a
  // ProviderNotice{kind:"verdandi_policy", subtype:"bypass_default_deny_applied"}. There is
  // deliberately no encoding of "bypass with zero gates": BYPASS installs no PreToolUse hook at all,
  // so it is the one combination where silence would mean nothing is watching, and it is therefore
  // the one silence must not be able to reach. A caller that states ANY restriction takes the
  // default off -- including a permissive one, and including one that names no real tool at all
  // (`deny: ["bash"]`, lowercase, is a typo the sidecar cannot distinguish from a statement). Both
  // are real holes and are meant to be read as ones.
  //
  // TWO LIMITS ON THE ANNOUNCEMENT, because a guarantee stated here and untrue in practice is worse
  // than no guarantee:
  //   1. The notice is produced at session construction and carries sequence 1, so it is observable
  //      to a REPLAY_START_AVAILABLE_HISTORY or REPLAY_START_AFTER_SEQUENCE watcher. A
  //      REPLAY_START_FROM_NOW watcher opened after CreateSession returns WILL NOT SEE IT -- by that
  //      mode's own definition ("only events produced after this watch is registered"). A client
  //      that needs to know whether the default fired must not watch FROM_NOW.
  //   2. ProviderNotice carries kind and subtype only, never a payload (see its own comment), so the
  //      notice says THAT the conservative default was applied, never WHICH tools it contains. The
  //      list is @verdandi/claude-runtime's exported CONSERVATIVE_BYPASS_DENY; a client that needs
  //      the names carries its own copy.
  //
  // And a scope limit on the default itself: it names built-in tools. `Options.disallowedTools` is
  // documented as "List of tool names"; the `mcp__server`-style matcher syntax is documented only on
  // a sibling API, so this list is NOT demonstrated to constrain MCP tools. `configuration:
  // ISOLATED` (strictMcpConfig + empty mcpServers) is the lever that closes those.
  ToolPolicy tool_policy = 6;

  // Absent => fall back entirely to `configuration` (NATIVE: user+project+local; ISOLATED: none).
  // That is byte-identical to what shipped before this field existed, which is what makes it
  // additive. Present => this exact set, whatever `configuration` says about axis A. Present with an
  // empty `sources` => no filesystem settings tiers, stated rather than defaulted.
  //
  // Not containment: this governs what is automatically INHERITED, not what is REACHABLE. A session
  // holding Read or Bash can still read ~/.claude/settings.json whether or not that tier was loaded,
  // and the SDK notes that even `[]` still reads the managed-settings policy tier from disk.
  SettingSourceSelection setting_sources = 7;

  // Opt-in: this session may later be switched to PERMISSION_MODE_BYPASS by SetPermissionMode.
  // Capability 'set_permission_mode'. Meaningful only for a GATED session (INTERACTIVE /
  // VERDANDI_RULES); a session created under BYPASS is already in bypass and ignores it.
  //
  // What it does: the CLI is launched with `--allow-dangerously-skip-permissions` (SDK
  // Options.allowDangerouslySkipPermissions), without which the CLI refuses a mid-session switch to
  // bypassPermissions. It changes no mode -- the session still starts in `default` and reports it --
  // but it does change the CLI's startup, which is why it is not on by default:
  //
  //   ROOT CAVEAT. The CLI refuses that flag when running as root (or under sudo) unless the
  //   environment sets IS_SANDBOX=1: it exits 1 at startup ("--dangerously-skip-permissions cannot
  //   be used with root/sudo privileges"), so the session dies before its first turn. A client that
  //   may run as root must not set this field, or must arrange IS_SANDBOX=1 for the sidecar.
  //
  // true also means ResolvePermissionRequest.defer is refused on this session (see there).
  //
  // false (the default, and what every client that predates the field sends): no flag, and
  // SetPermissionMode(BYPASS) on this session is refused with INVALID_CONFIGURATION before the CLI
  // is asked. Switching between the gated modes, and back out of a bypass this session entered by a
  // switch, needs no flag and is unaffected. Resume is a parameter of CreateSession, so a resumed
  // session states this in its own policy like any other.
  bool permission_mode_switchable = 8;

  // Opt-in: route the CLI's OWN permission prompts to this host as PermissionRequested events.
  // Capability 'provider_permission_prompts'. Decided from the mode the session is CREATED in:
  // meaningful only for PERMISSION_MODE_INTERACTIVE (and UNSPECIFIED, which is read as INTERACTIVE;
  // a value the sidecar does not know is refused); a session created under VERDANDI_RULES or BYPASS ignores it, and so
  // does a sidecar without the capability (proto3 unknown field) -- both of which leave exactly the
  // behaviour below under "false". A session created INTERACTIVE with it keeps it across
  // SetPermissionMode (see the end of this comment).
  //
  // Why it exists: the PreToolUse gate asks the host about every call, but the CLI can still ask on
  // its own AFTER the gate allowed a call. Its sensitive-file safety check (a Write to .git/probe,
  // .claude/settings.json, ...) is the measured case, and neither a hook allow nor a session allow
  // rule silences it. With no one to ask, a headless CLI refuses that call, and the host never learns
  // there was a question.
  //
  // true: the session is given an Agent SDK `canUseTool` callback. Each such ask becomes a
  // PermissionRequested with origin PERMISSION_ORIGIN_PROVIDER_PROMPT and the CLI's own words in
  // provider_reason, answered with ResolvePermission like any other request. It is IN ADDITION to the
  // gate, never instead of it: the gate still asks about every call first, and on CLI 2.1.283 a call
  // the gate allowed raised no provider prompt unless the CLI's own check wanted one (so ordinary
  // calls are not asked twice). A provider prompt normally carries the same tool_use_id as the
  // gate's request for that call, which came first and was already resolved -- measured, not
  // guaranteed: after SetPermissionMode(BYPASS) the gate abstains and asks nothing first, and an
  // EMPTY tool_use_id (the CLI gave none) correlates with nothing and must never be matched against
  // another request's empty id. A host that auto-approves a provider prompt on the strength of an
  // earlier answer must match a non-empty id, and must not auto-approve one carrying
  // provider_matched_ask_rule (see PermissionRequested). Answers:
  //   - allow: the call runs with its input unchanged. The sidecar never applies the CLI's own
  //     suggestions (one of them switches the CLI session to acceptEdits) or any permission update;
  //     each such ask is asked again next time.
  //   - deny: the call fails with `reason` as its message (or
  //     "This tool call was denied without a reason; no denial source was provided." when blank);
  //     the turn continues. Interrupt, close, provider death and SDK aborts carry explanatory
  //     lifecycle messages, without implying a human refusal or a timeout.
  //   - interrupt, close, the CLI cancelling the prompt, or provider death: denied, with exactly one
  //     PermissionResolved -- CANCELLED_BY_* / EXPIRED / PROVIDER_FAILED, as for the gate's own.
  //     Measured on CLI 2.1.283: InterruptTurn with a provider prompt pending returned in ms, the CLI
  //     cancelled the prompt itself (so its outcome is EXPIRED, not CANCELLED_BY_INTERRUPT), and the
  //     turn ended INTERRUPTED. There is no timeout otherwise: an unanswered provider prompt waits.
  // The callback makes the SDK launch the CLI with `--permission-prompt-tool stdio`, which adds three
  // tools to the model's context (AskUserQuestion, EnterPlanMode, ExitPlanMode); the sidecar
  // disallows those three on such a session, so its model sees the same tools as without the flag.
  // That removal is a limit of THIS WIRE, not a product choice: it has no event for a question or a
  // plan dialog and no RPC to answer one, so a model that called them would wait on a human nobody
  // can reach and hang the turn. A host that wants them needs a new capability (the events and an
  // answer RPC), not an opt-out here. SessionReady.init_fingerprint.tools is what the model was
  // actually offered in that session, and is the truth to read rather than this paragraph.
  // A tool_policy.allow naming one of them contradicts that and is refused as
  // INVALID_CONFIGURATION. The callback is installed once, at CreateSession: SetPermissionMode
  // neither adds nor removes it.
  //
  // false (the default, and what every client that predates the field sends): no callback, no tool
  // change -- the CLI's own asks are refused as they always were.
  bool provider_permission_prompts = 9;

  // The CLI's own permission mode under the gate; see CliPermissionMode. Capability 'cli_auto_mode'.
  // UNSPECIFIED (every client that predates the field) is byte-identical to what came before it.
  // Decided at CreateSession: a session created with AUTO refuses SetPermissionMode, because the
  // CLI's auto mode has no counterpart among the gated modes a switch could map it to, and
  // switching it to `default` would quietly drop what the host asked for.
  CliPermissionMode cli_permission_mode = 11;

  // The host's own, per-session decision to run on a CLI the sidecar does not vouch for. Capability
  // 'cli_compatibility_report'. It matters only to a sidecar the operator started with
  // VERDANDI_CLAUDE_SIDECAR_CLI_GATE=report: there, CreateSession is refused with
  // UNSUPPORTED_CLI_VERSION when the CLI this session would run (executable) is REFUSED or UNKNOWN
  // (see HandshakeResponse.cli_compatibility), unless this is true. UNTESTED and SUPPORTED never need
  // it. A sidecar in the default mode ignores it: it refused to start on such a CLI, so no request
  // can reach this point.
  //
  // false (the default, and what every client that predates the field sends): the refusal stands.
  // Setting it changes nothing else about the session: tools, permissions and settings are exactly
  // what the rest of the policy says.
  bool accept_unsupported_cli = 10;

  // Opt-in: the host can stop one background task at a time (StopTask), so the CLI is told it may
  // offer that per task. Capability 'task_control'; a host sends it only when the handshake lists
  // that capability. A sidecar that does not list it refuses true with INVALID_CONFIGURATION, reason
  // `per_task_stop_unsupported`, rather than ignore it. false (the default, and what every client
  // that predates the field sends) changes nothing.
  bool per_task_stop = 12;
}

// ---- CreateSession ----

message CreateSessionRequest {
  string cwd = 1;
  ClaudeHostPolicy policy = 2;

  // Resume: continue an existing provider (Claude) session instead of starting a fresh one.
  //
  // Modeled as parameters of CreateSession rather than a separate ResumeSession RPC because that is
  // the kernel's own shape -- @verdandi/claude-runtime's ClaudeSessionConfig carries `resume` and
  // `fork` as fields of the session config, which map straight onto the Agent SDK's Options.resume
  // and Options.forkSession. A separate RPC would have to invent a second session lifecycle in the
  // sidecar for no gain.
  //
  // `optional` (not a bare string) on purpose: proto3 field presence is what distinguishes "start
  // fresh" from "resume a session whose id happens to be empty", and an empty id must be an error
  // rather than a silent fresh start.
  optional string resume_provider_session_id = 3;

  // Only meaningful alongside resume_provider_session_id: branch the resumed history into a NEW
  // provider session instead of continuing the original (SDK Options.forkSession). Ignored when
  // resuming is not requested. Defined now even though no UI surfaces it, so the protocol does not
  // foreclose forking later.
  bool fork = 4;

  // Both fields are `optional` for the reason resume_provider_session_id is: presence is what says
  // "the caller chose". It also keeps TypeScript clients honest -- ts-proto encodes a plain string
  // with `!== ""`, so a request built from a partial object literal would send the text "undefined".
  //
  // Which model the session runs on (SDK Options.model): an alias such as "sonnet" or "opus", or a
  // full model id. Empty leaves the CLI's own default in force, which is what every session got
  // before this field existed -- so an older client that never sets it behaves exactly as before.
  //
  // Added so a caller can size the model to the job (verdandi's controlplane picks by how much is
  // at stake) instead of every session silently running on whatever the account's plan defaults to.
  optional string model = 5;

  // Reasoning effort (SDK Options.effort): one of "low", "medium", "high", "xhigh", "max". Empty
  // leaves the CLI default in force. Any other value is refused as INVALID_CONFIGURATION rather
  // than passed through, because the SDK's reaction to an unknown level is not something a caller
  // should discover in production.
  optional string effort = 6;

  // A full replacement prompt (SDK Options.systemPrompt as a plain string).
  // With neither prompt field present the Agent SDK uses its minimal prompt. To request Claude
  // Code's system prompt, use system_prompt_preset instead. A present blank replacement is refused
  // as INVALID_CONFIGURATION / system_prompt_blank. Both prompt fields present are refused as
  // INVALID_CONFIGURATION / system_prompt_conflict before checking either value for blanks.
  // Capability 'system_prompt': a client relying on replacement must check it, because an older
  // sidecar ignores this field and leaves the SDK's minimal prompt in use.
  optional string system_prompt = 7;

  // Schema-validated structured output: SDK Options.outputFormat = {type: 'json_schema', schema}.
  // Absent means plain text, as before this field existed. Present means the provider validates the
  // turn's answer against the schema and the sidecar delivers it as
  // TurnCompleted.structured_output_json. `json_schema_json` must parse as a JSON object; anything
  // else (including an empty string) is refused as INVALID_CONFIGURATION before a session exists.
  //
  // Capability 'output_format'. An older sidecar ignores the field and answers in plain text.
  OutputFormatSpec output_format = 8;

  // Ask CreateSession to return only once the session's account probe has settled, and to carry the
  // result in CreateSessionResponse.account_identity. The probe is the same one behind
  // SessionReady.account_identity, bounded by the same deadline (20 s). No turn exists yet when the
  // response is sent, so a client that checks the login email here and closes the session on a
  // mismatch has spent nothing.
  //
  // An OK answer always names a live session the client can use. If the probe failed or missed its
  // deadline while the session is alive, the answer is OK with account_identity.error set. If the
  // session ended while the call waited (its provider exited or failed, or it was closed), there is
  // no session to hand out: CreateSession fails with ERROR_CODE_PROVIDER_UNAVAILABLE and the close
  // reason in the message, whatever the probe said.
  //
  // What it does not prove: which credential carries the billing. The CLI reports the login's email
  // even while an API key is in use, and the key source is only reported in system/init
  // (SessionReady.init_fingerprint.api_key_source), after the first turn has started.
  //
  // false (the default, and what every client older than this field sends) changes nothing:
  // CreateSession returns as soon as the session exists. Waiting holds only this call; other
  // sessions, other calls and the handshake are served meanwhile. A client that cancels the call
  // while it waits never learns the session id, so the sidecar closes that session.
  // Capability 'await_account_identity'.
  bool await_account_identity = 9;

  // Explicitly request Claude Code's system prompt, optionally with an appended note.
  // Presence matters: {} requests the preset without append; absent leaves the SDK's minimal
  // prompt when system_prompt is also absent. Both fields remain outside a oneof so conflicting
  // requests can be refused. A present blank append is INVALID_CONFIGURATION /
  // system_prompt_append_blank. Capability 'system_prompt_preset'; check it before sending, since
  // an older sidecar ignores this field and leaves the SDK's minimal prompt in use.
  SystemPromptPreset system_prompt_preset = 10;

  // Interactions the host can show and answer itself. Capability 'structured_questions_v1'; a host
  // sends it only when the handshake lists that capability (an older sidecar does not know the field
  // and ignores it). Absent, or present with every member false, changes nothing. `questions = true`
  // needs PERMISSION_MODE_INTERACTIVE with provider_permission_prompts (INVALID_CONFIGURATION, reason
  // `client_interactions_needs_provider_prompts`, otherwise), and a sidecar that does not list the
  // capability refuses it with reason `client_interactions_unsupported`.
  ClientInteractions client_interactions = 11;

  // Held for a later minor's attachment switch, so that no other field can take the number first.
  reserved 12;
}

// The interactions a host opts into on CreateSession.
message ClientInteractions {
  // The model may ask the user structured questions (the CLI's AskUserQuestion tool), which arrive as
  // InteractionRequested and are answered with ResolveInteraction.
  bool questions = 1;
  // Held for plan approval.
  reserved 2;
}

// SDK Options.systemPrompt = {type: 'preset', preset: 'claude_code', append?}.
// Omit append for the unmodified preset. A present nonblank append is preserved verbatim.
message SystemPromptPreset {
  optional string append = 1;
}

// A JSON Schema carried as JSON text rather than google.protobuf.Struct -- the same "v1 simplicity"
// choice ToolCallStarted.input_json makes. The SDK has exactly one output format today
// (`json_schema`), so there is no type discriminator; one can be added beside this field later.
message OutputFormatSpec {
  string json_schema_json = 1;
}

message CreateSessionResponse {
  string session_id = 1;

  // Set only when the request asked for CreateSessionRequest.await_account_identity: the settled
  // account probe, in SessionReady.account_identity's shape. Absent otherwise.
  AccountIdentity account_identity = 2;
}

// ---- SendTurn / InterruptTurn / ResolvePermission / CloseSession ----

message SendTurnRequest {
  string session_id = 1;
  string command_id = 2;
  string text = 3;
  // The client's own id for this message, echoed on UserMessageDelivered / UserMessageDropped when
  // the CLI holds it behind a turn it started by itself. Any non-empty string, unique within the
  // session. Capability 'cli_turns'; absent means the sidecar names nothing back.
  optional string client_message_id = 4;
  // A person typed this text, as opposed to text the host or a plugin composed. The sidecar cannot
  // know who wrote a message, so the host says it: true makes the message the CLI receives carry
  // the SDK's human origin, which the CLI's checks for typed input read. Capability 'human_origin'.
  // A sidecar that does not list the capability refuses true with INVALID_CONFIGURATION, reason
  // `human_origin_unsupported`. false (the default, and what every client that predates the field
  // sends) is exactly the behaviour before it existed.
  bool typed_by_person = 5;
}

message SendTurnResponse {
  string turn_id = 1;
}

message InterruptTurnRequest {
  string session_id = 1;
  string command_id = 2;
}

message InterruptTurnResponse {}

message ResolvePermissionRequest {
  string session_id = 1;
  string command_id = 2;
  string permission_id = 3;
  bool allow = 4;
  string reason = 5;
  // Capability 'permission_defer'. true: the host makes no decision and leaves the call to the CLI's
  // own permission handling -- the auto-mode classifier under CLI_PERMISSION_MODE_AUTO, the CLI's
  // normal ask under `default` (which reaches this host as a PROVIDER_PROMPT request on a session with
  // provider_permission_prompts, and is refused otherwise). That handling includes everything the
  // session's loaded settings tiers say: their `permissions` allow and deny rules and any hooks of
  // their own. A user-tier `allow: ["Bash"]`, for one, lets a deferred Bash run without the classifier
  // ever seeing it. `reason` is ignored, and the request resolves with PERMISSION_OUTCOME_DEFERRED.
  //
  // Refused with INVALID_CONFIGURATION, the request staying pending for a real answer and nothing
  // recorded under the command_id:
  //   - together with allow = true (a deferral cannot also allow);
  //   - for a request with origin PROVIDER_PROMPT (that is the CLI's own question already);
  //   - on any session created with ClaudeHostPolicy.permission_mode_switchable = true, whatever its
  //     current mode. A host that can switch a session to BYPASS cannot also leave decisions to the
  //     CLI's mode: a deferral is decided in whatever mode the CLI is in when it acts on it, and a
  //     SetPermissionMode(BYPASS) sent before or after the deferral can reach the CLI first, so the
  //     call would run under bypassPermissions, past the conservative bypass floor that a fresh call
  //     of the same tool meets. No check at answer time can close that race, so the rule is
  //     structural. A session with cli_permission_mode AUTO is never switchable;
  //   - when the session's gate would not ASK about this call now (defence in depth).
  // An unknown or already-resolved permission_id is PERMISSION_NOT_FOUND, as for any answer.
  //
  // Only an explicit defer produces "no decision". Everything else that ends a request -- its hook
  // call timing out or being aborted, InterruptTurn, CloseSession, the provider dying -- still DENIES,
  // exactly as before this field existed. false (the default) is byte-identical to before.
  bool defer = 6;
}

message ResolvePermissionResponse {}

message CloseSessionRequest {
  string session_id = 1;
  string command_id = 2;
}

message CloseSessionResponse {}

// ---- SteerTurn ----
//
// Adds a user message to the turn that is running now, the way the Claude CLI's own composer does when
// the user types while Claude works. Capability 'steer_turn': a host calls it only when the handshake
// lists that (an older sidecar answers UNIMPLEMENTED), and even then each session refuses it with
// STEER_UNAVAILABLE until its own CLI has reported message lifecycles (below).
//
// The message goes to the CLI at once, with priority "next", and the CLI decides when the model sees
// it: after the running turn's current tool batch it is folded into that turn, which goes on with it;
// when no tool boundary comes (a plain-text answer) or the turn is interrupted, it runs as a turn of
// its own right after the running one ends. The response only says the message was handed over. Its
// fate arrives on the session's event stream, exactly once per accepted message:
//   - UserMessageDelivered{into_running_turn: true, turn_id: expected_turn_id} when it was folded in;
//   - TurnStarted{turn_id: T} (a turn this client did not start with SendTurn) followed, when the
//     message starts, by UserMessageDelivered{into_running_turn: false, turn_id: T}. The sidecar opens
//     T right after the running turn's TurnCompleted whenever a steered message's fate is still open
//     then, so SendTurn is refused with TURN_ALREADY_ACTIVE from that moment until T ends (the CLI
//     runs the held message before anything sent later). T then ends with TurnCompleted like any
//     turn. Several steered messages may run together in one such turn. A message steered into T
//     before the CLI began T is reported with into_running_turn: false too: it starts T;
//   - UserMessageDropped when it will never run (the CLI cancelled, discarded or refused it, or the
//     session closed first). A turn the sidecar opened only for messages that were all dropped before
//     it began ends with TurnCompleted{outcome: INTERRUPTED}.
//
// Interrupting does not withdraw steered messages, the same as Esc in the Claude CLI's own terminal:
// InterruptTurn stops the running turn, and every steered message the CLI still holds then runs as the
// turn T above (its UserMessageDelivered says into_running_turn: false). A host that shows a queue of
// steered messages should show them as still to run after an interrupt. Interrupting T itself before
// the CLI began it changes nothing: the CLI is idle, and the held messages still run. (The CLI can
// withdraw queued messages -- `cancel_async_message`, or an interrupt with `cancel_queued` -- but the
// Agent SDK's public Query type exposes neither, so this protocol does not either.)
//
// Errors, nothing sent to the CLI in any of them:
//   NO_ACTIVE_TURN     no turn is running; send the text with SendTurn instead.
//   TURN_MISMATCH      a turn is running but it is not expected_turn_id (the one the client meant has
//                      ended); the client chooses again.
//   STEER_UNAVAILABLE  this session cannot steer now; hold the message and send it with SendTurn when
//                      the turn ends. ErrorDetail.reason: `cli_lifecycle_not_reported` (the session's
//                      CLI has not listed `msg_lifecycle_v1` in a system/init, which includes the first
//                      moments of a session's first turn, before its system/init has been read) or
//                      `first_turn_held` (the first turn of a session that awaits its account
//                      identity has not reached the CLI yet).
//   INVALID_CONFIGURATION  ErrorDetail.reason `steer_client_message_id_missing`,
//                      `steer_expected_turn_id_missing`, `steer_text_empty` (empty or only whitespace)
//                      or `steer_client_message_id_reused` (already accepted on this session).
//   SESSION_NOT_FOUND  no such session, or it has closed.
// Idempotent per command_id like SendTurn: a retry with the same payload replays the response, a
// different payload under the same command_id is IDEMPOTENCY_CONFLICT.
message SteerTurnRequest {
  string session_id = 1;
  string command_id = 2;
  // The turn the client believes is running (a SendTurnResponse.turn_id, or the turn_id of a
  // TurnStarted it saw). Required.
  string expected_turn_id = 3;
  // The client's own id for this message, echoed on UserMessageDelivered / UserMessageDropped. Any
  // non-empty string, unique within the session. Required.
  string client_message_id = 4;
  string text = 5;
  // As SendTurnRequest.typed_by_person. Capability 'human_origin'.
  bool typed_by_person = 6;
}

message SteerTurnResponse {
  // The turn the message was steered into: expected_turn_id.
  string turn_id = 1;
}

// ---- SetPermissionMode ----
//
// Changes a LIVE session's permission mode, mid-conversation and mid-turn, without a new session or
// a resume. Maps to the Agent SDK's `Query.setPermissionMode()` (a `set_permission_mode` control
// request to the running CLI) plus the sidecar's own PreToolUse gate, which follows the new mode.
//
// Capability 'set_permission_mode'. An older sidecar does not have this RPC at all (UNIMPLEMENTED).
//
// What each target means, and what does NOT change on a switch:
//
//   BYPASS (from INTERACTIVE / VERDANDI_RULES): only for a session created with
//     ClaudeHostPolicy.permission_mode_switchable = true -- read its ROOT CAVEAT; any other gated
//     session is refused with INVALID_CONFIGURATION without a CLI round trip. Then the CLI is put
//     in `bypassPermissions` and the gate
//     stops asking -- it abstains, so the CLI's own bypass decides. The session's ToolPolicy is
//     static (it was applied at CreateSession) and is NOT re-applied. The one exception is the
//     conservative bypass floor (ClaudeHostPolicy.tool_policy's comment): a session whose policy
//     stated no tool restriction at all gets that floor on entering BYPASS exactly as a session
//     created under BYPASS would -- enforced by the gate denying those tools at call time rather
//     than by removing them from the model's context (which only CreateSession can do), and
//     announced by PermissionModeChanged.bypass_default_deny_applied plus the same ProviderNotice
//     {kind:"verdandi_policy", subtype:"bypass_default_deny_applied"}. State `unrestricted` at
//     CreateSession to decline it, as for a session created under BYPASS.
//   INTERACTIVE / VERDANDI_RULES (from BYPASS): the CLI goes back to `default` and the gate asks
//     again for every call. Only for a session CREATED under INTERACTIVE or VERDANDI_RULES: a
//     session created under BYPASS has no PreToolUse gate at all (its creation installs none, which
//     existing callers rely on), there is nothing to switch back on, and the request is refused
//     with INVALID_CONFIGURATION rather than producing a session that reports `default` while
//     nothing can ever answer its permission questions. A client that wants a switchable session
//     creates it gated and switches to BYPASS right after CreateSession.
//
// A session created with ClaudeHostPolicy.cli_permission_mode AUTO refuses every switch with
// INVALID_CONFIGURATION before the CLI is asked: its CLI mode is `auto`, which none of these targets
// maps to. Create a new session for a different mode.
//
// Permission requests already pending when the mode changes are left pending; answer them.
message SetPermissionModeRequest {
  string session_id = 1;
  string command_id = 2;
  // UNSPECIFIED is refused with INVALID_CONFIGURATION, never defaulted.
  PermissionMode mode = 3;
}

message SetPermissionModeResponse {
  // The provider-level mode the CLI acknowledged, in SessionReady.permission_mode's vocabulary:
  // `bypassPermissions` for BYPASS, `default` for INTERACTIVE / VERDANDI_RULES. Returned only after
  // the CLI accepted the change; a CLI refusal fails the RPC and leaves the session's mode as it was.
  string permission_mode = 1;
}

// ---- WatchSessionEvents ----

// How much history a watcher wants before it starts receiving live events.
//
// Replaces a bare `uint64 after_sequence` in which 0 carried at least four different meanings ("no
// cursor", "from the beginning", "from now", "whatever you still have"). The consequence was not
// theoretical: `replayAfter` guarded its gap check on `afterSequence > 0`, so a watch opened at 0
// against a session that had already evicted events silently skipped the evicted prefix -- while
// the strictly weaker request (after_sequence = 1) failed loudly. The caller asking for the most
// data got the least warning.
enum ReplayStart {
  // Rejected, never defaulted. The whole point of this enum is that 0 stops meaning anything: a
  // client that does not set `start` is a client whose intent is unknown, and guessing on its
  // behalf is what produced the defect above.
  REPLAY_START_UNSPECIFIED = 0;

  // Only events produced after this watch is registered. No replay. Cannot gap -- nothing
  // historical was requested. `after_sequence` must be absent.
  REPLAY_START_FROM_NOW = 1;

  // Every retained event with sequence > after_sequence, then live. The only mode that carries a
  // cursor, and the only one whose request can be REFUSED with EVENT_GAP. `after_sequence` is
  // required. (A stream opened in any mode can later END with EVENT_GAP: see
  // ERROR_CODE_EVENT_GAP.)
  REPLAY_START_AFTER_SEQUENCE = 2;

  // Every event still retained, then live. The honest replacement for the old after_sequence = 0:
  // the caller states that it holds no cursor and accepts that an evicted prefix may be missing.
  // Cannot gap, because partial history is what was asked for. A caller that needs to know whether
  // a prefix was evicted reads the first delivered `sequence` -- greater than 1 means events are
  // missing. Derivable rather than announced, which is acceptable ONLY because the caller opted
  // into partial history by name. `after_sequence` must be absent.
  REPLAY_START_AVAILABLE_HISTORY = 3;
}

message WatchSessionEventsRequest {
  string session_id = 1;

  // Field 2 was `uint64 after_sequence` with the overloaded meaning described on ReplayStart. Not
  // reused: a client built against the old meaning that reached a new server would have its cursor
  // read as a start mode. Reserving the NUMBER (not the name) is deliberate -- the name is the
  // clearest one for the cursor and is reused below at a new tag, and field names do not travel on
  // the binary wire.
  reserved 2;

  ReplayStart start = 3;

  // Required when start == REPLAY_START_AFTER_SEQUENCE, and an error with either other mode.
  // Supplying a cursor the server would ignore is how a caller comes to believe it asked for
  // something it did not.
  //
  // Validity, given `latest` (highest sequence ever assigned to this session, 0 if none) and
  // `oldest` (lowest still retained):
  //
  //   after_sequence >  latest              -> INVALID_CONFIGURATION (impossible / future cursor)
  //   after_sequence == latest              -> ok, no replay, straight to live
  //   oldest - 1 <= after_sequence < latest -> ok, replay (after_sequence, latest], then live
  //   after_sequence <  oldest - 1          -> EVENT_GAP
  //
  // The `oldest - 1` boundary is ok and not a gap: the caller last saw the event immediately before
  // the oldest retained one, so the replay range is contiguous with what it already holds.
  //
  // A future cursor is REFUSED rather than tolerated because it is numerically plausible and
  // semantically meaningless -- it can only come from another session, another sidecar process, or
  // a persisted value. Accepted silently it produces one of two invisible failures: the client
  // waits forever for sequences that will never be assigned, or live events arriving below the
  // bogus cursor are classified as already-delivered duplicates and dropped without a word.
  //
  // PROVENANCE. A sequence cursor is ephemeral stream state scoped to one (session, service
  // instance). It is not an identity, it is not durable, and it is not comparable across sessions
  // or across sidecar processes:
  //
  //     sequence cursor  !=  provider_session_id  !=  durable resume identity
  //
  // A cursor is only ever obtained by having received that event on this stream from this service.
  // Durable cursors would need an explicit epoch/identity model -- a sequence qualified by
  // something that changes when the server's numbering restarts. This protocol has no such model,
  // so it has no durable cursors.
  optional uint64 after_sequence = 4;
}

// ---- Typed events: source design doc §9.6's 14, the 11 this round implements (design spec §5.2) ----

message SessionReady {
  string session_id = 1;
  string provider_session_id = 2;
  string model = 3;
  string cwd = 4;

  // The permission mode the provider is ACTUALLY running under, verbatim from the Agent SDK's
  // system/init message: `bypassPermissions`, `default`, `acceptEdits`, `plan`, `dontAsk` or
  // `auto`. Passed through unmapped on purpose -- this field's whole job is to report what
  // happened rather than what was asked for, and translating it back into a PermissionMode enum
  // value would fold the two together again.
  //
  // A client that requested BYPASS and reads anything else here is running weaker than it believes
  // and should stop, not continue. A gated session reads `default`, or `auto` when it was created
  // with ClaudeHostPolicy.cli_permission_mode AUTO. That `default` is a guarantee, not a default a
  // repository can change: capability 'gated_cli_mode_default'.
  //
  // Measured 2026-09-18 against CLI 2.1.272, because a guard nobody has watched fail is not a
  // guard: this field does track the effective mode -- forcing `default` made it read "default"
  // while every bypass session read "bypassPermissions". Two further results from the same
  // measurement, both load-bearing for how this field should be read:
  //
  //   - A BEHAVIOURAL check is not a substitute. With the host's own auto-mode allowlist loaded
  //     (CONFIGURATION_PROFILE_NATIVE loads the operator's settings), a session downgraded to
  //     `default` still executed routine Bash and still looked entirely healthy. "The tool call
  //     worked" says nothing about the mode.
  //   - The specific downgrade this field was added to catch did not reproduce. Removing the CLI's
  //     bypass-consent setting (skipDangerousModePermissionPrompt) by every available means --
  //     false in the project tier, false in the programmatic settings tier, and settingSources []
  //     so the tier holding it is never loaded at all -- left `bypassPermissions` fully in force.
  //     The field is kept anyway: it is nearly free, and it is the only honest signal if a future
  //     CLI starts downgrading instead of refusing.
  //
  // Empty on a sidecar older than this field. A client must not read that emptiness as a
  // downgrade, and must not read it as an all-clear either.
  string permission_mode = 5;

  // Which account the provider actually authenticated as, from the SDK's Query.accountInfo(). The
  // kernel asks once per session, at session start. A completion-shaped session (an explicit empty
  // tool_policy.allow, or CreateSessionRequest.output_format) also holds its first turn's message
  // until it has the answer (bounded; a timeout sets `error`), so for it this is known before the
  // provider has seen any input. Every other session never waits: it carries the answer if it was
  // in by the time system/init arrived, and otherwise `error` says it was not.
  // HandshakeResponse.account_* say which account the operator PINNED; this says whose login the
  // CLI actually found there.
  //
  // SessionReady itself still arrives with the provider's system/init, i.e. at the start of the
  // first turn -- see ResumeStatus for why nothing earlier can carry it. A client that needs the
  // identity before the first turn asks for CreateSessionRequest.await_account_identity.
  //
  // Capability 'account_identity'. Absent from an older sidecar, which a client that requires an
  // identity must treat as unproven, never as a pass.
  AccountIdentity account_identity = 6;

  // What the provider's system/init reported about the session it actually built: its tool list,
  // MCP servers and API key source, verbatim. Present whenever system/init carried a tools list.
  //
  // Load-bearing for an explicit allow list (ClaudeHostPolicy.tool_policy.allow present, empty or
  // not): unless the list says INIT_CHECK_REPORT_ONLY, the kernel checks `tools` against it -- plus
  // HandshakeResponse.structured_output_tools when the session has CreateSessionRequest.output_format
  // -- and on any other tool, on a named tool that is missing, or on a system/init with no tools list
  // at all, closes the session with SESSION_CLOSE_REASON_TOOL_POLICY_VIOLATION immediately after
  // this SessionReady, before anything else of the turn is processed. Sessions without an allow list
  // are never checked.
  //
  // That close detects and terminates; it does not prevent. This SessionReady exists only once the
  // turn has started, so the first model call is already under way, and under
  // PERMISSION_MODE_BYPASS a tool call that starts before the close lands runs ungated. See
  // InitCheck.
  //
  // Capability 'init_fingerprint', which therefore also promises that close.
  InitFingerprint init_fingerprint = 7;

  // Options.disallowedTools exactly as this session handed it to the Agent SDK: the caller's
  // tool_policy.deny followed by every entry the sidecar adds itself (the bypass floor, the WebFetch
  // private-address rules when the allow list names WebFetch, the three prompt-routing tools under
  // provider_permission_prompts), in that order. Empty when nothing was disallowed. Recorded once,
  // when the session was created, so every SessionReady of the session carries the same list. A
  // bypass floor that a later SetPermissionMode brings into force is enforced by the PreToolUse gate,
  // not by Options, and does not appear here.
  // Capability 'effective_tool_report'.
  repeated string effective_disallowed_tools = 8;

  // Options.tools exactly as this session handed it to the Agent SDK: present exactly when the
  // request had tool_policy.allow, and then equal to its tools. It does not list
  // HandshakeResponse.structured_output_tools: the CLI adds those itself when an output format is
  // set. Absent when the session left the base tool set alone. Capability 'effective_tool_report'.
  EffectiveToolsOption effective_tools = 9;

  // Options.settingSources exactly as this session handed it to the Agent SDK: after the sidecar's
  // canonical order (user, project, local), its de-duplication, and the default taken from
  // `configuration` when the request carried no ClaudeHostPolicy.setting_sources. Never contains
  // SETTING_SOURCE_UNSPECIFIED. Empty means "no filesystem settings tier", stated: because the field
  // is repeated, an empty list and an absent one look the same on the wire, so a host reads emptiness
  // as a fact only from a sidecar that advertises 'effective_session_report'. Recorded once, when the
  // session was created. Says what was ASKED of the SDK, not what the CLI then found on disk.
  repeated SettingSource effective_setting_sources = 10;

  // The configuration profile this session ran under, with UNSPECIFIED resolved: NATIVE or ISOLATED,
  // never UNSPECIFIED from a sidecar that advertises 'effective_session_report'. The same value that
  // decided whether MCP discovery and auto-memory were closed (axis B of ConfigurationProfile), so
  // it is the one place a host reads that axis back.
  ConfigurationProfile effective_configuration = 11;

  // `permission_mode` normalised, so a host that must decide whether the CLI runs ungated does not
  // keep its own copy of the CLI's vocabulary. `permission_mode` (5) stays the verbatim string and is
  // the authority: a string this sidecar does not know is reported here as UNKNOWN and there
  // unchanged. UNSPECIFIED means the string was empty (system/init carried none) or the sidecar
  // predates 'effective_session_report'; a host must not read it as an all-clear.
  CliPermissionModeKind cli_permission_mode_kind = 12;
}

// The CLI's own permission modes, as the Agent SDK's PermissionMode type spells them, for
// SessionReady.cli_permission_mode_kind. Not the mode a host asked for (PermissionMode,
// CliPermissionMode): the mode the CLI reported.
enum CliPermissionModeKind {
  CLI_PERMISSION_MODE_KIND_UNSPECIFIED = 0;
  // `default`
  CLI_PERMISSION_MODE_KIND_DEFAULT = 1;
  // `acceptEdits`
  CLI_PERMISSION_MODE_KIND_ACCEPT_EDITS = 2;
  // `plan`
  CLI_PERMISSION_MODE_KIND_PLAN = 3;
  // `bypassPermissions`
  CLI_PERMISSION_MODE_KIND_BYPASS_PERMISSIONS = 4;
  // `dontAsk`
  CLI_PERMISSION_MODE_KIND_DONT_ASK = 5;
  // `auto`: the CLI's own classifier decides (ClaudeHostPolicy.cli_permission_mode AUTO).
  CLI_PERMISSION_MODE_KIND_AUTO = 6;
  // Any other non-empty string: a CLI newer than this sidecar. The verbatim string is in
  // permission_mode.
  CLI_PERMISSION_MODE_KIND_UNKNOWN = 7;
}

// A message rather than a bare repeated field so that "no tool list was passed" (absent) and "an
// empty tool list was passed" (present, no tools) stay apart, as they do on ToolAllowList.
message EffectiveToolsOption {
  repeated string tools = 1;
}

message InitFingerprint {
  repeated string tools = 1;
  repeated InitMcpServer mcp_servers = 2;
  // system/init's apiKeySource: 'none' for a claude.ai login, 'ANTHROPIC_API_KEY' when an API key
  // is in use. It cannot tell two logins apart (AccountIdentity does), but it does expose a leaked
  // API key. Empty when system/init did not report one.
  string api_key_source = 3;
}

message InitMcpServer {
  string name = 1;
  string status = 2;
}

// Exactly what accountInfo() returned, unmapped; a field is absent when it returned nothing for it.
// `error` is set -- and every other field absent -- when accountInfo() failed or did not answer in
// time, or (for a session that does not hold its first turn) had not answered yet when system/init
// arrived. The session runs either way: deciding whether an unproven identity is acceptable is the
// client's call, not the sidecar's.
message AccountIdentity {
  optional string email = 1;
  optional string organization = 2;
  optional string subscription_type = 3;
  optional string token_source = 4;
  optional string error = 5;
}

message TurnStarted {
  string turn_id = 1;
  // Who started the turn. Capability 'cli_turns'; UNSPECIFIED from a sidecar without it.
  TurnOrigin origin = 2;
  // Why the CLI started it, as far as the frames it sent say. Only on an origin CLI turn, and then
  // possibly refined by a TurnCauseUpdated before the turn's TurnCompleted. Capability 'cli_turns'.
  TurnCause cause = 3;
}

enum TurnOrigin {
  TURN_ORIGIN_UNSPECIFIED = 0;
  // A SendTurn.
  TURN_ORIGIN_CLIENT = 1;
  // The turn the sidecar opens for steered messages still held when the running turn ended (see
  // SteerTurn).
  TURN_ORIGIN_FOLLOW_UP = 2;
  // The CLI started it by itself: a background task finished, a scheduled prompt fired, a peer sent
  // a message.
  TURN_ORIGIN_CLI = 3;
}

// Why the CLI started a turn. Facts read from the CLI's frames, never text composed for a person.
// Which fields are set depends on `kind`: task_* and description/summary for TASK; wakeup_source,
// scheduled_for_ms, schedule_reason, cron_id and prompt for SCHEDULED; peer_name and text for PEER.
message TurnCause {
  TurnCauseKind kind = 1;
  optional string task_id = 2;
  optional TaskKind task_kind = 3;
  optional TaskStatus task_status = 4;
  optional string description = 5;
  optional string summary = 6;
  optional string peer_name = 7;
  // A peer's message body.
  optional string text = 8;
  optional string wakeup_source = 9;
  // When the scheduled prompt was due, milliseconds since the Unix epoch.
  optional int64 scheduled_for_ms = 10;
  optional string schedule_reason = 11;
  optional string cron_id = 12;
  // The scheduled prompt itself.
  optional string prompt = 13;
}

enum TurnCauseKind {
  TURN_CAUSE_KIND_UNSPECIFIED = 0;
  // A background task's notification.
  TURN_CAUSE_KIND_TASK = 1;
  TURN_CAUSE_KIND_SCHEDULED = 2;
  TURN_CAUSE_KIND_PEER = 3;
  // A cause the CLI named that is none of the above.
  TURN_CAUSE_KIND_OTHER = 4;
  // The frames said nothing about why.
  TURN_CAUSE_KIND_UNKNOWN = 5;
}

// A more specific cause for a turn already announced, read from a frame that arrived later (the
// closing result's origin). Sent before that turn's TurnCompleted. Capability 'cli_turns'.
message TurnCauseUpdated {
  string turn_id = 1;
  TurnCause cause = 2;
}

// The CLI ran a cycle of its own (for the reason in `cause`) after accepting a SendTurn but before
// taking that turn's message in. The cycle's frames carry turn_id, the open turn, whose id does not
// change; the message's own fate follows as UserMessageDelivered or UserMessageDropped. Sent only for
// a CLI that reports message lifecycles. Capability 'cli_turns'.
message CliCycleStarted {
  string turn_id = 1;
  TurnCause cause = 2;
}

// What a background task is.
enum TaskKind {
  TASK_KIND_UNSPECIFIED = 0;
  // A shell command run in the background.
  TASK_KIND_SHELL = 1;
  TASK_KIND_MONITOR = 2;
  // A subagent.
  TASK_KIND_LOCAL_AGENT = 3;
  TASK_KIND_WORKFLOW = 4;
  // A kind the CLI named that is none of the above; BackgroundTask.task_type has its word.
  TASK_KIND_OTHER = 5;
}

// A task's status, the CLI's own words one to one.
enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_PENDING = 1;
  TASK_STATUS_RUNNING = 2;
  TASK_STATUS_PAUSED = 3;
  TASK_STATUS_COMPLETED = 4;
  TASK_STATUS_FAILED = 5;
  TASK_STATUS_STOPPED = 6;
  TASK_STATUS_KILLED = 7;
}

// Which CLI frame a TaskEvent reports.
enum TaskEdge {
  TASK_EDGE_UNSPECIFIED = 0;
  TASK_EDGE_STARTED = 1;
  TASK_EDGE_PROGRESS = 2;
  TASK_EDGE_UPDATED = 3;
  // The task's notification: it ended, and the model is told.
  TASK_EDGE_NOTIFIED = 4;
}

// One background task as the CLI's roster lists it.
message BackgroundTask {
  string task_id = 1;
  optional string run_id = 2;
  TaskKind kind = 3;
  // The CLI's own type word, verbatim.
  string task_type = 4;
  string description = 5;
  optional string subagent_type = 6;
  optional string parent_task_id = 7;
  // The tool call that started it.
  optional string tool_use_id = 8;
  // The CLI keeps it running on its own account rather than for a call the model is waiting on.
  bool ambient = 9;
  optional string workflow_name = 10;
}

// The session's whole background-task roster; replace any roster held for the session. Capability
// 'background_tasks'.
message BackgroundTasksChanged {
  repeated BackgroundTask tasks = 1;
}

// Token and time spent by a background task so far.
message TaskUsage {
  uint64 total_tokens = 1;
  uint32 tool_uses = 2;
  uint64 duration_ms = 3;
}

// One CLI frame about one background task. Capability 'background_tasks' (workflow_progress:
// capability 'workflow_progress'). A task's own prompt and transcripts are never carried.
message TaskEvent {
  TaskEdge edge = 1;
  string task_id = 2;
  optional string run_id = 3;
  BackgroundTask task = 4;
  optional TaskStatus status = 5;
  optional string summary = 6;
  optional string last_tool_name = 7;
  TaskUsage usage = 8;
  // When the task ended, milliseconds since the Unix epoch.
  optional int64 end_time_ms = 9;
  optional string error = 10;
  optional bool is_backgrounded = 11;
  optional string reason = 12;
  // The path of the file the CLI writes the task's output to.
  optional string output_file = 13;
  // On PROGRESS edges of WORKFLOW tasks only.
  WorkflowProgress workflow_progress = 14;
}

// A workflow's phases and agents as its progress frame lists them.
message WorkflowProgress {
  repeated WorkflowPhase phases = 1;
  repeated WorkflowAgent agents = 2;
}

message WorkflowPhase {
  uint32 index = 1;
  string title = 2;
  string kind = 3;
}

message WorkflowAgent {
  uint32 index = 1;
  string label = 2;
  uint32 phase_index = 3;
  string state = 4;
  optional string model = 5;
  optional string agent_type = 6;
  optional uint64 tokens = 7;
  optional uint32 tool_calls = 8;
  optional uint64 duration_ms = 9;
  optional string error = 10;
}

// A notice the CLI's own terminal shows (retrying, rate limits, a model fallback, compaction, a
// peer's message held). `content` is the CLI's own text; the rest are typed facts. Capability
// 'session_notices'.
message SessionNotice {
  SessionNoticeKind kind = 1;
  NoticeLevel level = 2;
  optional string content = 3;
  optional uint32 attempt = 4;
  optional uint32 max_retries = 5;
  optional uint64 retry_delay_ms = 6;
  optional int32 error_status = 7;
  optional string from_model = 8;
  optional string to_model = 9;
  optional uint64 pre_tokens = 10;
  optional uint64 post_tokens = 11;
  optional RateLimitStatus rate_status = 12;
  // When the rate limit resets, milliseconds since the Unix epoch.
  optional int64 resets_at_ms = 13;
  optional double utilization = 14;
  optional string trigger = 15;
  optional string peer_name = 16;
  optional PeerHoldState hold_state = 17;
  // The CLI's word for why an API call is being retried, as its terminal prints it.
  optional string error_kind = 18;
  // A model refusal's fallback scope, `session` or `local`; absent means `session`.
  optional string fallback_scope = 19;
}

enum SessionNoticeKind {
  SESSION_NOTICE_KIND_UNSPECIFIED = 0;
  SESSION_NOTICE_KIND_API_RETRY = 1;
  SESSION_NOTICE_KIND_RATE_LIMIT = 2;
  SESSION_NOTICE_KIND_MODEL_FALLBACK = 3;
  SESSION_NOTICE_KIND_MODEL_REFUSAL = 4;
  // Compaction is running.
  SESSION_NOTICE_KIND_COMPACTING = 5;
  // Compaction finished: the conversation before this point was summarised.
  SESSION_NOTICE_KIND_COMPACT_BOUNDARY = 6;
  SESSION_NOTICE_KIND_INFORMATIONAL = 7;
  SESSION_NOTICE_KIND_NOTIFICATION = 8;
  SESSION_NOTICE_KIND_PEER_HOLD = 9;
}

enum NoticeLevel {
  NOTICE_LEVEL_UNSPECIFIED = 0;
  NOTICE_LEVEL_INFO = 1;
  NOTICE_LEVEL_NOTICE = 2;
  NOTICE_LEVEL_SUGGESTION = 3;
  NOTICE_LEVEL_WARNING = 4;
}

enum RateLimitStatus {
  RATE_LIMIT_STATUS_UNSPECIFIED = 0;
  RATE_LIMIT_STATUS_ALLOWED = 1;
  RATE_LIMIT_STATUS_ALLOWED_WARNING = 2;
  RATE_LIMIT_STATUS_REJECTED = 3;
}

enum PeerHoldState {
  PEER_HOLD_STATE_UNSPECIFIED = 0;
  PEER_HOLD_STATE_HELD = 1;
  PEER_HOLD_STATE_RELEASED = 2;
  PEER_HOLD_STATE_DROPPED = 3;
}

// The conversation was cleared (`/clear`), and the session goes on. The provider session id it goes
// on under, the one a resume or a history lookup needs, is the one in the SessionReady that follows
// (from the CLI's next system/init); it can differ from `new_conversation_id`, which is only the id
// the CLI's reset frame names. Capability 'conversation_reset'.
message ConversationReset {
  string new_conversation_id = 1;
  // What cleared it, when the CLI says (`clear` for the /clear command).
  optional string trigger = 2;
}

message TextDelta {
  string turn_id = 1;
  string text = 2;
  // The id of the Claude API message this text belongs to (`msg_...`): the `assistant` message's
  // `message.id` under STREAMING_MODE_COMPLETE, the enclosing `message_start` event's `message.id`
  // under STREAMING_MODE_PARTIAL. Two consecutive assistant messages with no tool call between them
  // carry different ids, so a change of id is where one reply ends and the next begins. One API
  // message can arrive as several content blocks (and, complete mode, several SDK messages): they
  // share the id.
  //
  // Absent when the provider did not report one. Capability 'text_delta_message_id'.
  optional string message_id = 3;
  // The Agent tool call this text belongs under, when a subagent produced it; absent for the main
  // thread. Capability 'subagent_frames'.
  optional string parent_tool_use_id = 4;
}

message ThinkingDelta {
  string turn_id = 1;
  string text = 2;
  // As TextDelta.message_id.
  optional string message_id = 3;
  // As TextDelta.parent_tool_use_id.
  optional string parent_tool_use_id = 4;
}

// input/content carried as a JSON string, not google.protobuf.Struct — v1 simplicity; revisit if a
// consumer needs structured access rather than parse-on-arrival.
message ToolCallStarted {
  string turn_id = 1;
  string tool_use_id = 2;
  string name = 3;
  string input_json = 4;
  // As TextDelta.parent_tool_use_id.
  optional string parent_tool_use_id = 5;
}

message ToolCallCompleted {
  string turn_id = 1;
  string tool_use_id = 2;
  string content_json = 3;
  bool is_error = 4;
  // As TextDelta.parent_tool_use_id.
  optional string parent_tool_use_id = 5;
}

// What raised a PermissionRequested. Capability 'provider_permission_prompts'.
enum PermissionOrigin {
  // A sidecar older than this field. Read it as PERMISSION_ORIGIN_HOOK: the gate was the only origin
  // there was.
  PERMISSION_ORIGIN_UNSPECIFIED = 0;
  // The sidecar's PreToolUse gate, which asks about every call of a gated session.
  PERMISSION_ORIGIN_HOOK = 1;
  // The CLI's own permission prompt (Agent SDK canUseTool), raised after the gate had answered --
  // only on a session created with ClaudeHostPolicy.provider_permission_prompts. The CLI keeps these
  // for checks of its own, the sensitive-file safety check being the measured one; provider_reason
  // says which.
  PERMISSION_ORIGIN_PROVIDER_PROMPT = 2;
}

message PermissionRequested {
  string permission_id = 1;
  string tool_use_id = 2;
  string tool_name = 3;
  string input_json = 4;
  // Stated on every request by a sidecar with the capability.
  PermissionOrigin origin = 5;
  // PROVIDER_PROMPT only: the CLI's own reason for asking (SDK `decisionReason`), verbatim -- e.g.
  // "Claude requested permissions to edit <path> which is a sensitive file." Absent when the CLI gave
  // none, and always absent for HOOK. English prose from the CLI, not a stable code: show it, do not
  // parse it.
  optional string provider_reason = 6;
  // PROVIDER_PROMPT only: the CLI's short subject for the prompt (SDK `description`), verbatim --
  // e.g. ".git/probe". Absent when the CLI gave none, and always absent for HOOK.
  optional string provider_description = 7;
  // PROVIDER_PROMPT only: the path that triggered the prompt (SDK `blockedPath`), e.g. a path outside
  // the allowed directories. Absent when the CLI gave none, and always absent for HOOK.
  optional string provider_blocked_path = 8;
  // PROVIDER_PROMPT only: present when a user-configured `permissions.ask` rule forced this prompt
  // (SDK `matchedAskRule`) -- from a settings tier the session loaded, which for a NATIVE or
  // project/local session includes files in the repository being worked on. The SDK's own guidance:
  // a host making policy on the reason, or running host-side auto-approval, should treat an ask
  // carrying this as rule-forced -- the user's stated intent is a human prompt. Absent otherwise, and
  // always absent for HOOK.
  MatchedAskRule provider_matched_ask_rule = 9;
}

// The `permissions.ask` rule behind a provider prompt, verbatim from the SDK's `matchedAskRule`.
message MatchedAskRule {
  // Which settings tier the rule came from, e.g. "projectSettings", "localSettings".
  string source = 1;
  string tool_name = 2;
  // The rule's content, e.g. "cat:*" for `Bash(cat:*)`; absent for a bare tool-name rule.
  optional string rule_content = 3;
}

enum PermissionOutcome {
  PERMISSION_OUTCOME_UNSPECIFIED = 0;
  PERMISSION_OUTCOME_ALLOWED = 1;
  PERMISSION_OUTCOME_DENIED = 2;
  PERMISSION_OUTCOME_CANCELLED_BY_INTERRUPT = 3;
  PERMISSION_OUTCOME_CANCELLED_BY_SESSION_CLOSE = 4;
  PERMISSION_OUTCOME_PROVIDER_FAILED = 5;
  PERMISSION_OUTCOME_EXPIRED = 6;
  // The host answered with ResolvePermissionRequest.defer: it made no decision, and the CLI's own
  // permission mode decided the call. Capability 'permission_defer'; only a host that sends defer
  // ever sees it. Whether the CLI then refused the call is a PermissionDenied (when the session
  // receives those) or the tool call's own result, never this outcome.
  PERMISSION_OUTCOME_DEFERRED = 7;
}

message PermissionResolved {
  string permission_id = 1;
  PermissionOutcome outcome = 2;
}

enum TurnOutcome {
  TURN_OUTCOME_UNSPECIFIED = 0;
  TURN_OUTCOME_COMPLETED = 1;
  TURN_OUTCOME_INTERRUPTED = 2;
  TURN_OUTCOME_FAILED = 3;
  TURN_OUTCOME_LIMIT_REACHED = 4;
}

message TurnCompleted {
  string turn_id = 1;
  TurnOutcome outcome = 2;
  string result_text = 3;
  bool is_error = 4;
  optional string stop_reason = 5;

  // The SDK result message's `structured_output`, JSON-encoded. Present only on a turn of a session
  // created with CreateSessionRequest.output_format whose answer the provider delivered; absent on
  // every other turn, including a structured-output turn that failed (read result_subtype).
  //
  // Capability 'structured_output'. The same capability covers the four fields below, which were
  // wired in the same commit.
  optional string structured_output_json = 6;

  // The next four are the SDK result message's own words about how the turn ended, passed through
  // unmapped so a client can classify a failure (quota, auth, schema retries exhausted) itself --
  // `outcome` above folds every unrecognised terminal reason into FAILED. All four are absent
  // (`errors` empty) on a TurnCompleted the kernel synthesized because the provider died or the
  // session closed mid-turn: no result message existed to read them from.
  //
  // `subtype`, verbatim: 'success', 'error_during_execution', 'error_max_turns',
  // 'error_max_budget_usd', 'error_max_structured_output_retries', ... An open set.
  optional string result_subtype = 7;
  // `terminal_reason`, verbatim: 'completed', 'api_error', 'blocking_limit',
  // 'structured_output_retry_exhausted', ... An open set.
  optional string terminal_reason = 8;
  // `api_error_status`: the HTTP status of the API call that failed the turn (401, 429, ...), when
  // the result message reports one.
  optional int32 api_error_status = 9;
  // `errors`, bounded: at most 8 entries of at most 2000 characters each; when the provider reported
  // more, the 8th entry says how many were dropped.
  repeated string errors = 10;

  // Token and cost accounting, summed over the result message's `modelUsage` -- every model the
  // query pipeline called (main loop, subagents, compaction), which the SDK names "the correct
  // field for token/cost accounting". NOT the result's `usage`, which covers the main loop only.
  //
  // CUMULATIVE for the session so far, because that is what the SDK reports: in a one-turn session
  // (the completion lane's shape) it is exactly that turn's spend; in a multi-turn session, subtract
  // the previous TurnCompleted's numbers to get one turn's. Absent when the result message carried
  // no usable `modelUsage`, and on a synthesized TurnCompleted. An estimate, not a billing statement.
  //
  // Capability 'turn_usage'.
  TurnUsage usage = 11;

  // The closing result's `origin.kind` verbatim (e.g. `task-notification`, `peer`), when it had one.
  // Capability 'cli_turns'.
  optional string origin_kind = 12;
  // The result message's `num_turns`, when it reported one. Capability 'cli_turns'.
  optional uint32 num_turns = 13;
}

message TurnUsage {
  // The input side is split three ways because the API bills the three differently and Claude Code
  // caches aggressively: on a large prompt `input_tokens` is typically single digits and nearly all
  // of the prompt shows up as cache_creation / cache_read. "Did my prompt arrive" must sum all three.
  uint64 input_tokens = 1;
  uint64 output_tokens = 2;
  uint64 cache_creation_input_tokens = 3;
  uint64 cache_read_input_tokens = 4;
  double total_cost_usd = 5;
  // The `modelUsage` key that accounted for the most tokens, i.e. the model that did the work. The
  // counts above are summed over ALL models, not only this one.
  string model = 6;
}

enum SessionCloseReason {
  SESSION_CLOSE_REASON_UNSPECIFIED = 0;
  SESSION_CLOSE_REASON_CLOSED_BY_HOST = 1;
  SESSION_CLOSE_REASON_PROVIDER_EXITED = 2;
  SESSION_CLOSE_REASON_PROVIDER_FAILED = 3;
  // The kernel closed the session because system/init's tool list did not match an explicit allow
  // list being verified (see SessionReady.init_fingerprint and InitCheck). Never produced for a list
  // marked INIT_CHECK_REPORT_ONLY. The turn in flight ends FAILED.
  SESSION_CLOSE_REASON_TOOL_POLICY_VIOLATION = 4;
}

message SessionClosed {
  SessionCloseReason reason = 1;
}

// Whether a session created with `resume_provider_session_id` actually attached to it.
//
// Emitted exactly once, and only for a session that asked to resume. Resume remains a parameter of
// CreateSession -- this introduces no second session lifecycle.
//
// Replaces an inference the client could not make safely. CreateSession returns before the provider
// has attempted to attach, so the client watched for a few seconds and treated silence as success.
// Measured, that had no margin: a real rejection surfaces at ~1.7-2.3s against a 3.0s window, so a
// loaded machine turns a genuine rejection into an accepted, empty, dead conversation.
enum ResumeStatus {
  RESUME_STATUS_UNSPECIFIED = 0;

  // The provider attached, and `attached_provider_session_id` says to what.
  //
  // Necessarily the LATE one. The provider reports its session id in a `system`/`init` message that
  // arrives at the start of a TURN, not at session construction -- measured: a valid resume with no
  // turn sent produced zero events over 24 seconds. So "rejected" is promptly knowable and
  // "attached" is not, and no protocol shape removes that asymmetry without sending a probe turn.
  RESUME_STATUS_ATTACHED = 1;

  // The provider refused the requested id -- it does not exist. Knowable in ~2s with no turn sent,
  // because the provider announces this one itself.
  RESUME_STATUS_REJECTED = 2;

  // The provider died before it could attach, for some reason other than refusing the id. Kept
  // distinct from REJECTED because they call for different things from a user: one means "that
  // conversation is gone", the other means "something is wrong with the provider".
  RESUME_STATUS_INITIALIZATION_FAILED = 3;
}

message ResumeOutcome {
  string requested_provider_session_id = 1;
  ResumeStatus status = 2;

  // Set only when status == ATTACHED. Compare it to the requested id: equal means the requested
  // session really did continue.
  string attached_provider_session_id = 3;

  // True when this session was created with `fork = true`, in which case the provider legitimately
  // returns a DIFFERENT id (measured: requested 3e1a9e6b..., attached 6301556f...) and an equality
  // check on the ids above is the wrong test. Load-bearing rather than decorative: without it, the
  // day fork is enabled every successful fork reports as a substituted session.
  bool forked = 4;

  // Human-readable, for the two failures. Safe to show a user.
  string detail = 5;
}

// A SetPermissionMode the CLI accepted. Emitted once per accepted SetPermissionMode, after the CLI
// acknowledged it, so every watcher -- not only the caller of the RPC -- learns the mode changed.
// The next turn's SessionReady.permission_mode is the provider's own independent report of the same
// thing (system/init is re-sent at every turn).
message PermissionModeChanged {
  // The mode that was requested and is now in force on the sidecar's gate.
  PermissionMode mode = 1;
  // What the CLI acknowledged, as SetPermissionModeResponse.permission_mode.
  string permission_mode = 2;
  // True when entering BYPASS applied the conservative bypass floor (see SetPermissionModeRequest).
  bool bypass_default_deny_applied = 3;
}

// The CLI refused a tool call on its own, before asking anyone: its auto-mode classifier, a deny
// rule from a loaded settings tier, or its mode (SDK `system/permission_denied`). Capability
// 'permission_denied_events'. The strings are the CLI's, verbatim.
//
// Only a session created with ClaudeHostPolicy.cli_permission_mode stated (DEFAULT or AUTO) receives
// this event. Any other session receives what it always did for the same message, a ProviderNotice
// {kind:"system", subtype:"permission_denied"}: the CLI emits these in `default` mode too (a settings
// tier's deny rule), and a client that predates this message could not decode it.
//
// Informational. The CLI has already refused the call and the model already has the refusal as the
// tool call's error result (ToolCallCompleted.is_error); nothing that keeps a session safe depends on
// a host receiving this.
message PermissionDenied {
  // The call it refused; correlates with ToolCallStarted.tool_use_id. Empty when the CLI gave none.
  string tool_use_id = 1;
  string tool_name = 2;
  // What decided (SDK `decision_reason_type`), e.g. "classifier", "rule", "mode". Absent when the
  // CLI gave none.
  optional string reason_type = 3;
  // The deciding component's own words (SDK `decision_reason`), e.g. "[Git Destructive]". English
  // from the CLI, not a stable code: show it, do not parse it. Absent when the CLI gave none.
  optional string reason = 4;
}

// A message sent with SteerTurn reached the model. Capability 'steer_turn'. SessionEvent.turn_id is
// turn_id too.
message UserMessageDelivered {
  // SteerTurnRequest.client_message_id.
  string client_message_id = 1;
  // The turn the model saw it in.
  string turn_id = 2;
  // true: folded into the turn it was steered into, which goes on with it. false: it runs in a turn of
  // its own (turn_id), which the sidecar announced with TurnStarted just before.
  bool into_running_turn = 3;
}

enum UserMessageDropReason {
  USER_MESSAGE_DROP_REASON_UNSPECIFIED = 0;
  // The CLI's own command_lifecycle states of these names: cancelled (by an interrupt that cancels
  // queued messages, or a cancel), discarded (the session's backlog was thrown away, e.g. on
  // end_session), refused (the CLI would not take it).
  USER_MESSAGE_DROP_REASON_CANCELLED = 1;
  USER_MESSAGE_DROP_REASON_DISCARDED = 2;
  USER_MESSAGE_DROP_REASON_REFUSED = 3;
  // The session ended before the CLI reported its fate.
  USER_MESSAGE_DROP_REASON_SESSION_CLOSED = 4;
}

// A message sent with SteerTurn will never reach the model. Capability 'steer_turn'.
message UserMessageDropped {
  string client_message_id = 1;
  UserMessageDropReason reason = 2;
}

// One slash command the session's CLI offers (the Agent SDK's SlashCommand).
message SlashCommand {
  // Without the leading slash.
  string name = 1;
  string description = 2;
  // e.g. "<file>"; empty when the command takes none.
  string argument_hint = 3;
  // Other names that resolve to this command.
  repeated string aliases = 4;
}

// The session's whole slash-command list; replace any list held for the session. Capability
// 'list_commands'. Sent once shortly after the session starts (the CLI's answer to the SDK's
// initialize request, which needs no turn), and again whenever the CLI reports a change
// (system/commands_changed, e.g. skills found as the agent works in a subdirectory). It has no fixed
// place among turn events: the first one usually comes before any turn, but a host that sends a turn
// at once may see it after that turn's first events. The newest list is always the last one sent.
// A watch that would not otherwise see the newest list -- started FROM_NOW, or its replay no longer
// holds it (evicted, or a reconnect after EVENT_GAP) -- makes the sidecar send it again as a new event
// with the next sequence; every watcher of the session receives that copy. Absent when the CLI never
// answered; a ProviderNotice {kind: "verdandi_commands", subtype: "unavailable" | "unreadable"} then
// says so.
message CommandsUpdated {
  repeated SlashCommand commands = 1;
}

// kind/subtype only, never a raw payload field -- design spec §3.2/§5.2's "never pass raw JSON through".
message ProviderNotice {
  string kind = 1;
  optional string subtype = 2;
}

// ---- Interactions (capability 'structured_questions_v1') ----
//
// A question the model asks the user (the CLI's AskUserQuestion), offered only on a session created
// with CreateSessionRequest.client_interactions.questions. Only the user answers it: no rule, mode or
// automatic answer resolves one.

// The model asked; the host shows it and answers with ResolveInteraction.
message InteractionRequested {
  // Random, unique per question, single-use.
  string interaction_id = 1;
  // The tool call the question came from; empty when the SDK gave none.
  string tool_use_id = 2;
  // QUESTION only in this minor.
  InteractionKind kind = 3;
  oneof payload {
    QuestionSet questions = 10;
  }
  // Set when the question could not be offered (the payload is then absent); an InteractionResolved
  // with HOST_REFUSED follows at once.
  optional string unsupported_reason = 4;
}

enum InteractionKind {
  INTERACTION_KIND_UNSPECIFIED = 0;
  INTERACTION_KIND_QUESTION = 1;
  // Held for plan approval.
  reserved 2;
}

message QuestionSet {
  repeated Question questions = 1;
}

message Question {
  string question = 1;
  string header = 2;
  bool multi_select = 3;
  repeated QuestionOption options = 4;
}

message QuestionOption {
  string label = 1;
  string description = 2;
  optional string preview = 3;
}

// How an interaction ended. Sent exactly once per InteractionRequested.
message InteractionResolved {
  string interaction_id = 1;
  InteractionOutcome outcome = 2;
  // ANSWERED and CHAT_REQUESTED: exactly what was sent to the model, per answered question.
  repeated ShownAnswer answers = 3;
  // HOST_REFUSED and PROVIDER_FAILED: why, plain text, bounded.
  optional string reason = 4;
}

message ShownAnswer {
  uint32 question_index = 1;
  string answer = 2;
  optional string notes = 3;
}

enum InteractionOutcome {
  INTERACTION_OUTCOME_UNSPECIFIED = 0;
  INTERACTION_OUTCOME_ANSWERED = 1;
  INTERACTION_OUTCOME_DECLINED = 2;
  // The user declined to answer in the form and wants to reply in the chat instead.
  INTERACTION_OUTCOME_CHAT_REQUESTED = 3;
  INTERACTION_OUTCOME_INTERRUPTED = 4;
  INTERACTION_OUTCOME_EXPIRED = 5;
  INTERACTION_OUTCOME_SESSION_CLOSED = 6;
  INTERACTION_OUTCOME_PROVIDER_FAILED = 7;
  INTERACTION_OUTCOME_HOST_REFUSED = 8;
}

// The host's answer to one InteractionRequested. Idempotent per (session_id, command_id): the same
// request returns the original outcome, a different payload under the same id is IDEMPOTENCY_CONFLICT.
// INTERACTION_NOT_FOUND for an unknown, spent or other-session id; INTERACTION_ANSWER_REFUSED when the
// answer breaks a rule (ErrorDetail.reason names it), which leaves the interaction pending and records
// nothing under the command_id.
message ResolveInteractionRequest {
  string session_id = 1;
  string command_id = 2;
  string interaction_id = 3;
  oneof result {
    QuestionAnswers answers = 10;
    QuestionDecline decline = 11;
  }
  // Held for plan-approval results.
  reserved 12 to 19;
}

message QuestionAnswers {
  repeated QuestionAnswer answers = 1;
}

message QuestionAnswer {
  uint32 question_index = 1;
  repeated uint32 option_indexes = 2;
  optional string other_text = 3;
  optional string notes = 4;
}

message QuestionDecline {
  QuestionDeclineKind kind = 1;
  // What the user had answered so far; CHAT only.
  QuestionAnswers so_far = 2;
}

enum QuestionDeclineKind {
  QUESTION_DECLINE_KIND_UNSPECIFIED = 0;
  QUESTION_DECLINE_KIND_CANCEL = 1;
  QUESTION_DECLINE_KIND_CHAT = 2;
}

message ResolveInteractionResponse {
  InteractionOutcome outcome = 1;
}

// The questions still waiting for an answer, for a host that reconnects.
message GetInteractionStateRequest {
  string session_id = 1;
}

message GetInteractionStateResponse {
  // The event sequence the snapshot is consistent with.
  uint64 through_sequence = 1;
  // Live, unsettled.
  repeated InteractionRequested pending = 2;
}

// ---- Background task control (capabilities 'task_control', 'task_output') ----

// Stops one background task (a workflow included). Idempotent per command_id. TASK_NOT_FOUND for a
// task the session does not know; a task that has already ended stops successfully.
message StopTaskRequest {
  string session_id = 1;
  string command_id = 2;
  string task_id = 3;
}

message StopTaskResponse {}

// The tail of a background task's output. A read, so it carries no command_id.
// TASK_OUTPUT_UNAVAILABLE when there is none to read (always for WORKFLOW and LOCAL_AGENT tasks).
message GetTaskOutputRequest {
  string session_id = 1;
  string task_id = 2;
}

message GetTaskOutputResponse {
  // Bytes, not a string: the tail may start inside a UTF-8 sequence. Decode it lossily.
  bytes output = 1;
  // The whole output's size.
  uint64 total_bytes = 2;
  // `output` is only the tail of it.
  bool truncated = 3;
}

message SessionEvent {
  string session_id = 1;
  uint64 sequence = 2;
  int64 occurred_at = 3;
  optional string turn_id = 4;

  oneof event {
    SessionReady session_ready = 10;
    TurnStarted turn_started = 11;
    TextDelta text_delta = 12;
    ThinkingDelta thinking_delta = 13;
    ToolCallStarted tool_call_started = 14;
    ToolCallCompleted tool_call_completed = 15;
    PermissionRequested permission_requested = 16;
    PermissionResolved permission_resolved = 17;
    TurnCompleted turn_completed = 18;
    SessionClosed session_closed = 19;
    ProviderNotice provider_notice = 20;
    ResumeOutcome resume_outcome = 21;
    // Capability 'set_permission_mode'.
    PermissionModeChanged permission_mode_changed = 22;
    // Capability 'permission_denied_events'; only on a session that stated cli_permission_mode.
    PermissionDenied permission_denied = 23;
    // Capability 'steer_turn'.
    UserMessageDelivered user_message_delivered = 24;
    UserMessageDropped user_message_dropped = 25;
    // Capability 'list_commands'.
    CommandsUpdated commands_updated = 26;
    // Capability 'cli_turns'.
    TurnCauseUpdated turn_cause_updated = 30;
    CliCycleStarted cli_cycle_started = 31;
    // Capability 'background_tasks'.
    BackgroundTasksChanged background_tasks_changed = 32;
    TaskEvent task_event = 33;
    // Capability 'session_notices'.
    SessionNotice session_notice = 34;
    // Capability 'conversation_reset'.
    ConversationReset conversation_reset = 35;
    // Capability 'structured_questions_v1'.
    InteractionRequested interaction_requested = 40;
    InteractionResolved interaction_resolved = 41;
  }

  // 27-28 are not used; 29 is held for a later minor's planning-state event. 36-39 are free for
  // later turn events and 42-49 for later interactions.
  reserved 27 to 29;
}

// ---- Error model: source design doc §9.7's subset this round actually triggers (design spec §5.3) ----

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INCOMPATIBLE_PROTOCOL = 1;
  ERROR_CODE_UNSUPPORTED_CLI_VERSION = 2;
  ERROR_CODE_SESSION_NOT_FOUND = 3;
  ERROR_CODE_TURN_ALREADY_ACTIVE = 4;
  ERROR_CODE_NO_ACTIVE_TURN = 5;
  ERROR_CODE_PERMISSION_NOT_FOUND = 6;
  ERROR_CODE_PERMISSION_ALREADY_RESOLVED = 7;
  ERROR_CODE_IDEMPOTENCY_CONFLICT = 8;
  // Two cases, one meaning for the client. Refusing a WatchSessionEvents request at once: its
  // after_sequence is older than the replay buffer still holds, so nothing is delivered and that
  // cursor cannot be served. Or ending a stream that was delivering: the watcher stopped reading,
  // and the live messages it held from earlier pump ticks reached the replay buffer's capacity (the
  // n of event_buffer_policy "bounded-<n>"). Everything before the error was delivered; reconnect
  // with after_sequence set to the last sequence received. Neither case ends the session, but a
  // reconnect after it has ended on its own gets SESSION_NOT_FOUND.
  ERROR_CODE_EVENT_GAP = 9;
  ERROR_CODE_INVALID_CONFIGURATION = 10;
  ERROR_CODE_PROVIDER_UNAVAILABLE = 11;
  ERROR_CODE_PROVIDER_PROTOCOL_ERROR = 12;
  ERROR_CODE_DEADLINE_EXCEEDED = 13;
  // SteerTurn: a turn is running, but not the expected_turn_id the request named.
  ERROR_CODE_TURN_MISMATCH = 14;
  // SteerTurn: this session cannot steer now (ErrorDetail.reason says why); hold the message for
  // SendTurn when the turn ends.
  ERROR_CODE_STEER_UNAVAILABLE = 15;
  // StopTask, GetTaskOutput: the session has no task of that id.
  ERROR_CODE_TASK_NOT_FOUND = 16;
  // GetTaskOutput: the task has no output this sidecar can read.
  ERROR_CODE_TASK_OUTPUT_UNAVAILABLE = 17;
  // 18-29 are left for later task and turn errors.
  // ResolveInteraction: an unknown, spent or other-session interaction_id.
  ERROR_CODE_INTERACTION_NOT_FOUND = 30;
  // ResolveInteraction: the answer breaks a rule (ErrorDetail.reason names it); the interaction stays
  // pending.
  ERROR_CODE_INTERACTION_ANSWER_REFUSED = 31;
}

message ErrorDetail {
  ErrorCode code = 1;
  string message = 2;
  // A stable, machine-readable name for WHICH rule refused the request, for the codes that cover many
  // rules (today INVALID_CONFIGURATION: a policy or request field the sidecar will not honour, such as
  // `tool_policy_empty_name` or `executable_unavailable`). Lower-case words joined by underscores, from
  // the list in COMPATIBILITY.md; `message` stays the human text and may be reworded, this may not.
  // Empty when the sidecar has no reason code for the refusal, and always empty on a sidecar older than
  // the capability 'startup_report_file'. A host that does not know a value must treat it as "some
  // refusal of this error code", not as a failure of its own.
  string reason = 3;
}

// ---- Service: the 7 in-scope RPCs (plan's Global Constraints; design spec §1), plus
// SetPermissionMode (2026-09-26, capability 'set_permission_mode') and SteerTurn (2026-10-13,
// capability 'steer_turn') ----

service RuntimeService {
  rpc Handshake(HandshakeRequest) returns (HandshakeResponse);
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  rpc SendTurn(SendTurnRequest) returns (SendTurnResponse);
  rpc WatchSessionEvents(WatchSessionEventsRequest) returns (stream SessionEvent);
  rpc InterruptTurn(InterruptTurnRequest) returns (InterruptTurnResponse);
  rpc ResolvePermission(ResolvePermissionRequest) returns (ResolvePermissionResponse);
  rpc CloseSession(CloseSessionRequest) returns (CloseSessionResponse);
  rpc SetPermissionMode(SetPermissionModeRequest) returns (SetPermissionModeResponse);
  rpc SteerTurn(SteerTurnRequest) returns (SteerTurnResponse);
  // Capability 'task_control'. A sidecar without it answers UNIMPLEMENTED.
  rpc StopTask(StopTaskRequest) returns (StopTaskResponse);
  // Capability 'task_output'. A sidecar without it answers UNIMPLEMENTED.
  rpc GetTaskOutput(GetTaskOutputRequest) returns (GetTaskOutputResponse);
  // Capability 'structured_questions_v1'. A sidecar without it answers UNIMPLEMENTED.
  rpc ResolveInteraction(ResolveInteractionRequest) returns (ResolveInteractionResponse);
  rpc GetInteractionState(GetInteractionStateRequest) returns (GetInteractionStateResponse);
}
